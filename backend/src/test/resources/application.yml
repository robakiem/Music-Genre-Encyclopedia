# Test profile: in-memory H2 so the Spring context + JPA mappings + seeding
# can be verified without a running PostgreSQL. Production uses PostgreSQL.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=LEGACY
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

app:
  cors-allowed-origins: http://localhost:5173
  jwt:
    secret: bXVzaWMtZ2VucmUtZW5jeWNsb3BlZGlhLXN1cGVyLXNlY3JldC1rZXktY2hhbmdlLW1l
    expiration-ms: 86400000
